name: Checks

on: [push, pull_request]

jobs:
  qmllint:
    runs-on: ubuntu-20.04
    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get install -y --no-install-recommends qtdeclarative5-dev-tools

    - name: Run qmllint
      run: |
        find . -name \*.qml -exec /usr/lib/x86_64-linux-gnu/qt5/bin/qmllint {} \+

  ESLint:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Install ESLint
      run: |
        npm install -D eslint@9.25.1 @eslint/eslintrc@3.3.1 @eslint/js@9.25.1 globals@16.0.0

    - name: Run ESLint
      run: |
        npx eslint plasmoid/

  Shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v2

    - name: Run ShellCheck
      uses: ludeeus/action-shellcheck@1.1.0
